#
# Tag a merge to main (semver), then build and publish the container image to
# the GitHub Container Registry (ghcr.io). No external credentials are needed —
# the build authenticates with the built-in GITHUB_TOKEN — which suits this
# public repository. Flux image automation in deploy-production-apps picks up
# the new tag and rolls the deployment.
#
# One-time setup: after the first push, set the `gobl.kyb` package to
# **public** in its GitHub package settings so the cluster (and Flux) can pull
# and scan it without credentials. The Dockerfile's
# org.opencontainers.image.source label links the package to this repo.
#

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write # the tag action pushes a new tag
  packages: write # push the image to ghcr.io

env:
  REGISTRY: ghcr.io
  REPO_PATH: invopop

jobs:
  tag-build-publish:
    name: Tag, Build, Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0" # make sure we get all commits!

      - name: Get repo details
        run: |
          echo "COMMIT_TYPE=$(echo $GITHUB_REF | cut -d / -f 2)" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d / -f 2-)" >> $GITHUB_ENV
          echo "REPO_VERSION=$(echo $GITHUB_REF | cut -d / -f 3-)" >> $GITHUB_ENV

      - name: Bump version and push tag
        id: bump
        if: env.COMMIT_TYPE != 'tags'
        uses: anothrNick/github-tag-action@1.52.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCHES: main
          WITH_V: true

      - name: Set Version from Semver Tag
        if: env.COMMIT_TYPE != 'tags'
        run: |
          echo "REPO_VERSION=${{ steps.bump.outputs.new_tag }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build -t ${{ env.REPO_NAME }} \
            --build-arg VERSION=${{ env.REPO_VERSION }} \
            --build-arg DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            .

      - name: Tag Image
        run: |
          docker image tag ${{ env.REPO_NAME }} ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ env.REPO_NAME }}:${{ env.REPO_VERSION }}

      - name: Tag Latest Main Release
        if: env.COMMIT_TYPE != 'tags'
        run: |
          docker image tag ${{ env.REPO_NAME }} ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ env.REPO_NAME }}:latest

      - name: Publish
        run: |
          docker image push --all-tags ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ env.REPO_NAME }}
