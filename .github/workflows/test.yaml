name: Test Go
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      # No external services needed: the suite uses an in-memory store,
      # tempdir identities, and httptest — no live CouchDB.
      - name: Test
        run: go test -race ./...
